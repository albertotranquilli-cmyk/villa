name: Volume RC focused E2E validation

on:
  push:
    branches:
      - codex/validate-volume-e8d5737
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volume-rc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zarr: ["2.18.7", "3.4.1"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only Volume test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.3.5" "pytest==9.0.2" "fsspec" "pynrrd" "PyYAML" "requests" "Pillow"
          if [ "${{ matrix.zarr }}" = "2.18.7" ]; then
            python -m pip install "numcodecs==0.15.1" "zarr==2.18.7"
          else
            python -m pip install "numcodecs==0.16.6" "zarr==3.4.1"
          fi
      - name: Verify exact candidate source and test blobs
        run: |
          git show HEAD:vesuvius/src/vesuvius/data/volume.py | git hash-object --stdin | grep -Fx 'a09472fd9919a3235f886f74e66de0321b73ee8d'
          git show HEAD:vesuvius/tests/data/test_volume_int_cast.py | git hash-object --stdin | grep -Fx 'a69d7289217cd58ff948a616174064086394a66e'
          git show HEAD:vesuvius/tests/data/test_volume_int_cast_e2e.py | git hash-object --stdin | grep -Fx 'ae34f85379c68b5ec3d2021c098857a6561e59f9'
          python -c "import sys,numpy,zarr,pytest; print('RUNTIME',sys.version,numpy.__version__,zarr.__version__,pytest.__version__)"
      - name: Run original Volume cast test modules, all cases
        env:
          AGENTS_AGENT_MODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: vesuvius/src
        run: |
          python -m pytest -q --tb=short             vesuvius/tests/data/test_volume_int_cast.py             vesuvius/tests/data/test_volume_int_cast_e2e.py
